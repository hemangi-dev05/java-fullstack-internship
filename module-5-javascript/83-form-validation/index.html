
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | PeakProSys</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<main class="registration-container">
    <section class="form-card">
        <header class="form-header">
            <div class="brand">PeakProSys</div>
            <h1>Student Registration</h1>
            <p>Create your student account to explore our training programs.</p>
        </header>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <small class="error-message" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
                <small class="error-message" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" maxlength="10" placeholder="10-digit mobile number">
                <small class="error-message" id="mobileError"></small>
            </div>

            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course">
                    <option value="">Choose a course</option>
                    <option value="Java Full Stack">Java Full Stack</option>
                    <option value="Python Full Stack">Python Full Stack</option>
                    <option value="MERN Stack">MERN Stack</option>
                    <option value="Data Science">Data Science</option>
                </select>
                <small class="error-message" id="courseError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password">
                <small class="error-message" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password">
                <small class="error-message" id="confirmPasswordError"></small>
            </div>

            <label class="terms">
                <input type="checkbox" id="terms">
                <span>I agree to the terms and conditions.</span>
            </label>
            <small class="error-message" id="termsError"></small>

            <button type="submit" class="submit-button">Register Now</button>

            <p id="successMessage" class="success-message"></p>
        </form>

        <footer>© 2026 PeakProSys. All rights reserved.</footer>
    </section>
</main>

</body>
</html>
